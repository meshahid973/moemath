name: Generate lockfile

on:
  push:
    branches: [chore/generate-lockfile]

permissions:
  contents: write

jobs:
  lock:
    if: github.repository == 'meshahid973/moemath'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "Generate npm lockfile"
          git push origin HEAD:refs/heads/chore/generate-lockfile
